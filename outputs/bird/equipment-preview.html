<!doctype html><html lang="ru"><meta charset="utf-8"><title>SpaceBird — лампа и аккумуляторы</title>
<style>body{margin:0;background:#020408;color:#ddd;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}nav{position:absolute;top:16px;left:16px;background:#06121be0;padding:12px}a{color:#ffd079;margin-right:16px}</style>
<canvas></canvas><nav>Лампа и аккумуляторы · <a href="?off=1">Выключить</a><a href="?">Включить</a><a href="/">В игру</a><span id="status">Загрузка…</span></nav>
<script type="module">
import {createGame} from './src/model.js';import {SpaceView} from './src/render3d.js';
const g=createGame(()=>.5),view=new SpaceView(document.querySelector('canvas'));
g.tool=null;g.ship.objects.push({type:'lamp',x:0,z:0,enabled:!new URLSearchParams(location.search).has('off')});
g.resources.push({type:'powerPack',x:17,y:16,z:0},{type:'emptyPack',x:32,y:16,z:0});
Object.assign(g.player,{x:0,y:32,z:65});const look={yaw:0,pitch:-.3};
await view.assetsReady;view.render(g,look,0,null);document.querySelector('#status').textContent='Готово';
addEventListener('resize',()=>{view.resize();view.render(g,look,0,null);});
</script></html>
