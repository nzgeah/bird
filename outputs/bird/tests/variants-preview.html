<!doctype html><meta charset="utf-8"><title>BIRD — варианты моделей</title>
<style>body{margin:0;background:#101a24;color:white;font:14px system-ui}#status{position:absolute;padding:16px}canvas{display:block}</style><div id="status">Загрузка 12 моделей…</div>
<script type="module">
import * as THREE from '../vendor/three.module.js';
import {loadGameAssets} from '../src/assets.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#101a24');
scene.add(new THREE.HemisphereLight(0xffffff,0x667788,3));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(2,4,6);scene.add(sun);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,1000);camera.position.set(0,0,300);
const assets=await loadGameAssets();
Object.entries(assets.floating).forEach(([name,template],i)=>{const mesh=template.clone(true);const size=new THREE.Box3().setFromObject(mesh).getSize(new THREE.Vector3());mesh.scale.multiplyScalar(29/Math.max(size.x,size.y,size.z));mesh.position.set((i%6-2.5)*44,i<6?32:-32,0);mesh.rotation.set(.35,.3,.1);scene.add(mesh);});
renderer.render(scene,camera);document.querySelector('#status').textContent='12 / 12 · Сверху: лист, балка, труба, броня, ротор, солнечная панель. Снизу: 6 астероидов.';
</script>
