<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#142630;color:white;font:18px sans-serif}#world{position:fixed;inset:0;background:repeating-linear-gradient(35deg,#193b50 0 40px,#31556a 40px 80px);display:grid;place-items:center;font-size:50px}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}nav{position:fixed;z-index:5;background:#123;padding:20px}button{padding:12px}</style><div id="world">BIRD · OPTICAL SENSOR</div><canvas id="fx"></canvas><nav><button data-hp="100">Исправен</button><button data-hp="55">Повреждён</button><button data-hp="15">Критическое состояние</button><span id="result"></span></nav><script type="module">
import {DamageVision,damageLevel} from '../src/damage-vision.js';
if(damageLevel(100)!==0||damageLevel(0)!==1||damageLevel(-10)!==1)throw Error('health clamp');
let hp=100,last=performance.now();const fx=new DamageVision(document.querySelector('#world'),document.querySelector('#fx'));document.querySelectorAll('button').forEach(b=>b.onclick=()=>{hp=Number(b.dataset.hp);document.querySelector('#result').textContent=b.textContent;});function frame(now){fx.update(hp,now/1000,(now-last)/1000,true);last=now;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
