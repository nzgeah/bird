<!doctype html><html><meta charset="utf-8"><title>SpaceBird — Equipment models</title><style>body{margin:0;background:#161d25;color:#cdd4d9;font:14px Arial}canvas{display:block}header{position:absolute;top:32px;left:38px;pointer-events:none}h1{font-size:27px;font-weight:400;letter-spacing:4px;margin:8px 0}small{color:#8d9da8;letter-spacing:3px}footer{position:absolute;bottom:28px;left:38px;color:#95a8b5}button,a{background:#293945;color:white;border:1px solid #617580;padding:9px 15px;text-decoration:none;margin-right:8px;cursor:pointer}</style><script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script><header><small>SPACEBIRD / EQUIPMENT</small><h1>ORBITAL EQUIPMENT</h1><p>CARGO MODULE / SCANNER / MANEUVERING ENGINE</p></header><footer><button id="front">Front</button><button id="back">Rear</button><a href="cargoPod.glb" download>Cargo GLB</a><a href="antenna.glb" download>Scanner GLB</a><a href="engine.glb" download>Engine GLB</a><span id="status">Loading…</span></footer><script type="module">
import * as T from '../vendor/three.module.js';import {GLTFLoader} from '../vendor/loaders/GLTFLoader.js';
const scene=new T.Scene();scene.background=new T.Color('#161d25');const camera=new T.PerspectiveCamera(34,innerWidth/innerHeight,.01,100);camera.position.set(3.0,3.1,7.6);camera.lookAt(0,1,0);const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.append(renderer.domElement);scene.add(new T.HemisphereLight('#d3eaff','#343946',2.0));
for(const [pos,color,intensity] of [[[2,4,4],'#e7f1ff',4],[[-3,2,2],'#6aa6bd',2],[[1,3,-3],'#ffcf83',4]]){const l=new T.DirectionalLight(color,intensity);l.position.set(...pos);l.castShadow=true;l.shadow.mapSize.set(2048,2048);l.shadow.camera.left=-3;l.shadow.camera.right=3;l.shadow.camera.top=3;l.shadow.camera.bottom=-3;l.shadow.bias=-.0003;scene.add(l);}
const floor=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:'#1b232b',roughness:.9}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
let model=new T.Group();scene.add(model);let count=0;
for(const [type,x] of [['cargoPod',-2],['antenna',0],['engine',2]])new GLTFLoader().load(type+'.glb',g=>{g.scene.position.x=x;g.scene.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true;count++;}});model.add(g.scene);document.querySelector('#status').textContent=count+' meshes · GLB loaded';},undefined,e=>document.querySelector('#status').textContent=String(e));
document.querySelector('#front').onclick=()=>{model.rotation.y=0;};document.querySelector('#back').onclick=()=>{model.rotation.y=Math.PI;};let held=false,px=0;renderer.domElement.onpointerdown=e=>{held=true;px=e.clientX};onpointerup=()=>held=false;onpointermove=e=>{if(held&&model){model.rotation.y+=(e.clientX-px)*.009;px=e.clientX}};renderer.setAnimationLoop(()=>renderer.render(scene,camera));
</script></html>
