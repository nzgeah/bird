<!doctype html><html lang="ru"><meta charset="utf-8"><title>SpaceBird — магнитный крюк</title><style>body{margin:0;background:#111a23;color:#d7e6e9;font:14px Arial}canvas{display:block}header{position:absolute;top:24px;left:32px;pointer-events:none}h1{font-size:25px;font-weight:400;letter-spacing:3px;margin:8px 0}small{color:#9db6c2;letter-spacing:2px}footer{position:absolute;bottom:22px;left:32px}button,a{background:#243642;border:1px solid #526c78;color:#e0eff2;padding:10px 14px;margin-right:7px;text-decoration:none;cursor:pointer}.label{position:absolute;top:76%;font-size:15px;letter-spacing:2px;text-align:center;pointer-events:none}.one{left:15%;width:30%}.two{left:57%;width:16%}.three{left:78%;width:19%}#status{font-size:12px;margin:12px 0}</style><script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script><header><small>SPACEBIRD / CONCEPT 01</small><h1>МАГНИТНЫЙ КРЮК</h1><p>Модели для оценки · без изменения игровой механики</p><div id="status">Загрузка…</div></header><div class="label one">МАГНИТНЫЙ ИЗЛУЧАТЕЛЬ</div><div class="label two">E · ПРИТЯЖЕНИЕ</div><div class="label three">ЛКМ · ИМПУЛЬС</div><footer><button id="rotate">Вращать крюк</button><button id="wave">Показать волну</button><a href="magnetic-hook.glb" download>Крюк GLB</a><a href="attraction-orb.glb" download>Шар E</a><a href="repulsion-orb.glb" download>Шар ЛКМ</a></footer><script type="module">
import * as T from '../vendor/three.module.js';import {GLTFLoader} from '../vendor/loaders/GLTFLoader.js';
const scene=new T.Scene();scene.background=new T.Color('#111a23');const camera=new T.PerspectiveCamera(34,innerWidth/innerHeight,.01,100);camera.position.set(0,2.5,6.6);camera.lookAt(0,.65,0);
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;document.body.append(renderer.domElement);
scene.add(new T.HemisphereLight('#d9efff','#242a35',2.4));for(const [pos,color,power] of [[[2,4,4],'#e5f4ff',3],[[-3,2,1],'#7dd3dc',2],[[0,3,-3],'#ffc17f',3]]){const l=new T.DirectionalLight(color,power);l.position.set(...pos);scene.add(l);}
const floor=new T.Mesh(new T.PlaneGeometry(60,60),new T.MeshStandardMaterial({color:'#111a23',roughness:.85}));floor.rotation.x=-Math.PI/2;floor.position.y=-.25;scene.add(floor);
const loader=new GLTFLoader();let gun,orbE,orbL,wave,spin=false,pulse=0;
try{const files=await Promise.all(['magnetic-hook','attraction-orb','repulsion-orb','impulse-wave'].map(n=>loader.loadAsync(n+'.glb')));[gun,orbE,orbL,wave]=files.map(g=>g.scene);
gun.position.set(-1.35,.80,0);gun.rotation.set(.12,-.88,.06);gun.scale.setScalar(1.5);scene.add(gun);
orbE.position.set(.80,.75,0);orbE.scale.setScalar(1.35);scene.add(orbE);
orbL.position.set(2.15,.75,0);orbL.scale.setScalar(1.35);scene.add(orbL);wave.position.copy(orbL.position);wave.visible=false;scene.add(wave);
document.querySelector('#status').textContent='4 GLB загружены · материалы и геометрия проверяются в просмотре';
}catch(e){document.querySelector('#status').textContent='Ошибка загрузки: '+e.message;}
document.querySelector('#rotate').onclick=()=>spin=!spin;document.querySelector('#wave').onclick=()=>pulse=1;
let prev=performance.now();function draw(t){const dt=Math.min(.05,(t-prev)/1000);prev=t;if(gun&&spin)gun.rotation.y+=dt*.5;if(orbE)orbE.rotation.y+=dt*.35;if(orbL)orbL.rotation.y-=dt*.35;if(wave){wave.visible=pulse>0;if(pulse>0){pulse=Math.max(0,pulse-dt*.55);wave.scale.setScalar(.3+(1-pulse)*.75);wave.traverse(o=>{if(o.isMesh){o.material.transparent=true;o.material.opacity=(o.name.startsWith('Wavefront')?.4:.07)*pulse;}});}}renderer.render(scene,camera);requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
