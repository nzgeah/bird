<!doctype html><html lang="ru"><meta charset="utf-8"><title>SpaceBird — проверка магнитного крюка</title><style>body{margin:0;color:white;font:15px Arial}aside{position:absolute;left:20px;top:20px;background:#102034dc;padding:15px}button{padding:12px;margin:5px}#aim{position:absolute;left:50%;top:50%;color:#bdf6ff}</style><canvas></canvas><aside><div>Игровая модель и настоящая логика снарядов</div><button id="pull">E — притянуть</button><button id="fire">ЛКМ — импульс</button><button id="reset">Вернуть обломки</button><div id="status">Загрузка…</div></aside><div id="aim">+</div><script type="module">
import {SpaceView} from '../src/render3d.js';import {createGame,launchHook,updateResources} from '../src/model.js';import {fireMagnet,updateMagnet} from '../src/magnet.js';
const g=createGame(),view=new SpaceView(document.querySelector('canvas'));g.asteroids=[];g.player.x=0;g.player.y=90;g.player.z=200;g.enemy.x=10000;g.energy=100;g.tool='hook';let fired=0;
function reset(){g.resources=[{type:'metal',variant:'01_torn_sheet',x:0,y:90,z:0,vx:0,vy:0,vz:0},{type:'cell',x:55,y:90,z:-20,vx:0,vy:0,vz:0},{type:'polymer',x:-55,y:90,z:-20,vx:0,vy:0,vz:0},{type:'circuit',x:0,y:145,z:-20,vx:0,vy:0,vz:0}];g.hook=null;g.magnetProjectiles=[];g.magnetWaves=[];}reset();
await view.assetsReady;document.querySelector('#fire').onclick=()=>{if(fireMagnet(g,{x:0,y:90,z:-500}))fired++;};document.querySelector('#pull').onclick=()=>launchHook(g,{x:0,y:90,z:0});document.querySelector('#reset').onclick=reset;
let prev=performance.now();function draw(now){const dt=Math.min(.04,(now-prev)/1000);prev=now;g.time+=dt;updateResources(g,dt);updateMagnet(g,dt);view.render(g,{yaw:0,pitch:0},dt);document.querySelector('#status').textContent='Выстрелов: '+fired+' · Летящих шаров: '+(g.magnetProjectiles?.length??0)+' · Движущихся обломков: '+g.resources.filter(r=>Math.hypot(r.vx,r.vy,r.vz)>10).length;requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
